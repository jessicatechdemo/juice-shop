<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Explanation Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0f1e;
      --panel: #10192d;
      --panel-alt: #0d1424;
      --panel-muted: #15203a;
      --border: rgba(160, 174, 208, 0.18);
      --text: #ecf2ff;
      --muted: #9fb0d8;
      --accent: #7cc7ff;
      --accent-strong: #44a7ff;
      --warning: #ffcf70;
      --success: #7cd9a3;
      --danger: #ff9b9b;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(68, 167, 255, 0.15), transparent 28%),
        radial-gradient(circle at top right, rgba(124, 217, 163, 0.12), transparent 22%),
        var(--bg);
      color: var(--text);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(380px, 44%) minmax(480px, 56%);
      height: 100vh;
      gap: 1px;
      background: var(--border);
    }

    .left-pane,
    .right-pane {
      min-height: 0;
      background: var(--panel-alt);
    }

    .left-pane {
      display: grid;
      grid-template-rows: auto auto 1fr;
    }

    .hero {
      padding: 28px 28px 18px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(124, 199, 255, 0.06), transparent);
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.15;
    }

    .section-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: rgba(12, 20, 36, 0.86);
      backdrop-filter: blur(8px);
    }

    .section-tab {
      border: 1px solid var(--border);
      background: var(--panel-muted);
      color: var(--muted);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .section-tab.active {
      color: var(--text);
      border-color: rgba(124, 199, 255, 0.55);
      background: rgba(68, 167, 255, 0.14);
      box-shadow: inset 0 0 0 1px rgba(124, 199, 255, 0.22);
    }

    .explanation-scroll {
      overflow: auto;
      padding: 24px 24px 40px;
    }

    .section-card {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.01), rgba(255, 255, 255, 0.03));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .section-card h1,
    .section-card h2,
    .section-card h3 {
      margin: 0;
      scroll-margin-top: 24px;
    }

    .section-card h1 {
      font-size: 28px;
      line-height: 1.2;
      margin-bottom: 18px;
    }

    .section-card h2 {
      font-size: 22px;
      margin-top: 30px;
      margin-bottom: 14px;
    }

    .section-card h3 {
      font-size: 18px;
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .section-card p,
    .section-card li,
    .section-card td,
    .section-card th,
    .section-card blockquote {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .section-card strong {
      color: var(--text);
    }

    .section-card p,
    .section-card ul,
    .section-card ol,
    .section-card table,
    .section-card blockquote,
    .section-card pre {
      margin: 0 0 16px;
    }

    .section-card li + li {
      margin-top: 10px;
    }

    .section-card a {
      color: var(--accent);
    }

    .section-card hr {
      border: 0;
      border-top: 1px solid var(--border);
      margin: 22px 0;
    }

    .section-card blockquote {
      margin-left: 0;
      padding: 14px 16px;
      border-left: 4px solid var(--accent);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
    }

    .section-card code {
      font-family: 'IBM Plex Mono', monospace;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 1px 6px;
      color: #d7eeff;
      font-size: 12px;
    }

    .section-card pre {
      overflow: auto;
      padding: 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(6, 11, 22, 0.9);
    }

    .section-card pre code {
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 13px;
      line-height: 1.7;
    }

    .section-card table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 14px;
      border: 1px solid var(--border);
    }

    .section-card th,
    .section-card td {
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      text-align: left;
      vertical-align: top;
    }

    .section-card th {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }

    .section-card tr:last-child td {
      border-bottom: 0;
    }

    .ref-chip {
      border: 1px solid rgba(124, 199, 255, 0.28);
      background: rgba(68, 167, 255, 0.12);
      color: #d7eeff;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'IBM Plex Mono', monospace;
    }

    .ref-chip {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin: 0 2px;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    .ref-chip.active {
      background: rgba(68, 167, 255, 0.3);
      border-color: rgba(124, 199, 255, 0.75);
    }

    .mermaid-wrap {
      position: relative;
      margin: 0 0 16px;
      padding: 48px 16px 16px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      overflow: auto;
    }

    .mermaid-diagram {
      min-width: fit-content;
    }

    .mermaid-expand {
      position: absolute;
      top: 12px;
      right: 12px;
      border: 1px solid rgba(124, 199, 255, 0.28);
      background: rgba(68, 167, 255, 0.12);
      color: #d7eeff;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
    }

    .mermaid-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: rgba(4, 8, 18, 0.82);
      backdrop-filter: blur(6px);
      z-index: 1000;
    }

    .mermaid-modal.open {
      display: flex;
    }

    .mermaid-modal-card {
      position: relative;
      width: min(1200px, 100%);
      height: min(80vh, 900px);
      padding: 56px 20px 20px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      box-shadow: var(--shadow);
      overflow: auto;
    }

    .mermaid-modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      border: 1px solid rgba(160, 174, 208, 0.2);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'IBM Plex Mono', monospace;
      cursor: pointer;
    }

    .mermaid-modal-content {
      min-width: fit-content;
      min-height: 100%;
    }

    .mermaid-error {
      border-left: 4px solid var(--danger);
      color: var(--text);
      font-size: 13px;
      line-height: 1.7;
    }

    .section-empty {
      display: grid;
      place-items: center;
      padding: 48px 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    .right-pane {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .code-header {
      padding: 22px 22px 16px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(124, 199, 255, 0.05), transparent);
    }

    .code-title {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 16px;
      font-weight: 700;
    }

    .file-path {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: #d7eeff;
    }

    .line-range {
      color: var(--muted);
      font-size: 13px;
      font-family: 'IBM Plex Mono', monospace;
    }

    .code-meta {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    #editor {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    .code-footer {
      padding: 10px 16px;
      border-top: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      font-family: 'IBM Plex Mono', monospace;
      overflow: auto;
      white-space: nowrap;
    }

    .empty-state,
    .monaco-error {
      display: grid;
      place-items: center;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
    }

    @media (max-width: 1080px) {
      .layout {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(0, 54%) minmax(0, 46%);
      }

      .section-tabs {
        padding-top: 14px;
        padding-bottom: 14px;
      }
    }
  </style>
</head>

    const EXPLANATION_DATA = {"title": "Regression Test Validation Report: GitHub CodeQL Alert 46", "repoRoot": "/Users/jessica/Library/CloudStorage/OneDrive-IBM/GitHub/demo/juice-shop", "markdown": "# Regression Test Validation Report: GitHub CodeQL Alert 46\n\nThis report explains what the regression tests validate for the `js/log-injection`\npatch in `lib/challengeUtils.ts`, how each assertion detects the original defect,\nand what evidence establishes that the patch succeeds.\n\n## Executive Summary\n\n**Finding:** GitHub CodeQL alert 46 reported that an attacker-controlled challenge\nname could insert carriage-return or newline characters into a warning log entry.\n\n**Security invariant:** A missing challenge name may be logged, but the value passed\nto `logger.warn` must not contain `\\r` or `\\n`. One request must therefore remain one\nphysical log record.\n\n**Result:** The focused unit test passed **3/3** and the route-level API test passed\n**4/4**, both with exit code `0`. The regression was also exercised before the patch;\nthe malicious case failed because the captured log argument still contained CR/LF.\nThat before/after result demonstrates that the test is sensitive to the vulnerable\nbehavior and becomes green because of the patch.\n\n## Vulnerable Data Flow and Patch Boundary\n\nThe application registers an unauthenticated `GET /rest/repeat-notification`\nendpoint in [[server.ts:608-608]]. The handler decodes the attacker-controlled\n`challenge` query value and passes it to `findChallengeByName`\n[[routes/repeatNotification.ts:9-12]].\n\nWhen no challenge matches, `findChallengeByName` reaches the warning-log sink. The\npatch removes CR and LF characters only at that sink\n[[lib/challengeUtils.ts:93-100]]. The original `challengeName` is still used for the\nlookup, so the fix does not alter which challenge is found.\n\n```mermaid\nflowchart LR\n  A[HTTP challenge query] --> B[decodeURIComponent]\n  B --> C[findChallengeByName]\n  C --> D{Challenge found?}\n  D -- Yes --> E[Return original challenge]\n  D -- No --> F[Remove CR and LF for logging]\n  F --> G[logger.warn receives one-line value]\n```\n\n## What the Unit Regression Test Validates\n\nThe unit test replaces `logger.warn` with a mock, invokes `findChallengeByName`\ndirectly, and inspects the exact arguments captured by that mock. It exercises four\nattacker-input classes: LF, CR, CRLF, and repeated LF. Every lookup must still return\n`undefined`, and every captured log argument must fail to match `/[\\r\\n]/`\n[[test/server/challengeUtils.unit.test.ts:43-57]].\n\nThis establishes two properties:\n\n1. Missing challenge behavior is preserved: the function still returns `undefined`.\n2. Log-record injection is blocked: neither CR nor LF reaches the logger.\n\nA separate compatibility assertion verifies that an ordinary missing name is still\nlogged with the exact original message\n[[test/server/challengeUtils.unit.test.ts:31-41]]. An existing challenge is also\nstill returned normally [[test/server/challengeUtils.unit.test.ts:59-61]].\n\n### Why the unit assertion fails without the patch\n\nBefore the patch, the mock captured a value equivalent to:\n\n```text\nMissing challenge with name: missing\\r\\nforged log entry\n```\n\nBecause that value matches `/[\\r\\n]/`, `assert.doesNotMatch` fails. With the patch,\nthe logger receives the one-line equivalent `Missing challenge with name:\nmissingforged log entry`, so the assertion passes.\n\n## What the API Regression Test Validates\n\nThe API test sends `%0D%0A`, the URL-encoded form of CRLF, through the real endpoint\ninstead of calling the utility directly. It mocks the logger, performs the request,\nrequires HTTP status `200`, and checks that the captured log argument contains no CR\nor LF [[test/api/repeat-notification.test.ts:37-51]].\n\nThis proves the mitigation holds across the complete relevant path:\n\n1. Supertest sends the malicious query string.\n2. Express supplies it to the route.\n3. `decodeURIComponent` produces the CRLF-containing challenge name.\n4. `findChallengeByName` reaches the missing-challenge warning.\n5. The logger mock captures the final value after sanitization.\n6. The test fails unless the response remains `200` and the captured value is one line.\n\nThe surrounding API tests preserve the legitimate contract for requests without a\nchallenge, with an unsolved challenge, and with a solved challenge\n[[test/api/repeat-notification.test.ts:22-35]]\n[[test/api/repeat-notification.test.ts:53-59]].\n\n## How the Tests Determine That the Patch Succeeded\n\nThe tests do not infer success from the implementation text. They observe the value\nat the security-sensitive boundary: the argument actually passed to `logger.warn`.\n\n| Success criterion | Assertion and evidence | Failure signal |\n| --- | --- | --- |\n| CR/LF cannot reach the log sink | `assert.doesNotMatch(logArgument, /[\\r\\n]/)` | Any CR or LF causes an assertion failure |\n| Missing-name behavior remains | Result equals `undefined` | Changed lookup behavior causes an assertion failure |\n| Normal log text remains | Safe log argument equals the original expected message | Unnecessary modification causes an assertion failure |\n| Existing lookup remains | Known challenge object is returned | Lookup regression causes an assertion failure |\n| HTTP behavior remains | Response status equals `200` | Route behavior change causes an assertion failure |\n| Real route reaches the sink | API test reads the first captured mock call | Missing log call or bad argument causes the test to fail |\n\nThe key evidence is the combination of **negative proof** (no captured log value\ncontains CR/LF) and **compatibility proof** (lookup results, safe log text, and HTTP\nstatus are unchanged).\n\n## Recorded Test Results\n\nFocused unit regression run:\n\n```text\ntests 3\npass 3\nfail 0\nexit code 0\n```\n\nIsolated route-level API regression run:\n\n```text\ntests 4\npass 4\nfail 0\nexit code 0\n```\n\nThe API test was run from the isolated validation copy because the OneDrive-backed\nsandbox can exhaust its file-watcher allowance after the assertions finish. In the\nworkspace run, all four API assertions passed before that unrelated `EMFILE` watcher\nerror. The isolated run removed that environmental noise and completed cleanly with\nexit code `0`.\n\n## Coverage Limits\n\nThe regression tests prove closure of the reported CodeQL condition for CR and LF,\nincluding encoded CRLF through the real HTTP route. They do not claim that every\npossible Unicode line-separator convention is normalized; that is outside the\nspecific `js/log-injection` data flow tested here. GitHub CodeQL should still be\nrerun after the patch is pushed to confirm alert 46 is closed in the analyzed commit.\n\n## Conclusion\n\nThe regression test knows the patch succeeds because the same attacker-controlled\nvalue that previously reached `logger.warn` with embedded line breaks is now captured\nwithout CR/LF, while all checked legitimate behavior remains unchanged. The passing\nunit and API layers jointly validate both the narrow sink fix and its real endpoint\nintegration.\n", "references": [{"id": "ref-1", "literal": "[[server.ts:608-608]]", "file_id": "file-1", "file_path": "server.ts", "absolute_path": "/Users/jessica/Library/CloudStorage/OneDrive-IBM/GitHub/demo/juice-shop/server.ts", "start_line": 608, "end_line": 608}, {"id": "ref-2", "literal": "[[routes/repeatNotification.ts:9-12]]", "file_id": "file-2", "file_path": "routes/repeatNotification.ts", "absolute_path": "/Users/jessica/Library/CloudStorage/OneDrive-IBM/GitHub/demo/juice-shop/routes/repeatNotification.ts", "start_line": 9, "end_line": 12}, {"id": "ref-3", "literal": "[[lib/challengeUtils.ts:93-100]]", "file_id": "file-3", "file_path": "lib/challengeUtils.ts", "absolute_path": "/Users/jessica/Library/CloudStorage/OneDrive-IBM/GitHub/demo/juice-shop/lib/challengeUtils.ts", "start_line": 93, "end_line": 100}, {"id": "ref-4 nexport const solve = async function (challenge: ChallengeModel, isRestore = false, isCheating = false) {\n  challenge.solved = true\n  const solvedChallenge = await challenge.save()\n\n  logger.info(`${isRestore ? colors.grey('Restored') : colors.green('Solved')} ${solvedChallenge.difficulty}-star ${colors.cyan(solvedChallenge.key)} (${solvedChallenge.name})`)\n  sendNotification(solvedChallenge, isRestore)\n  if (!isRestore) {\n    const cheatScore = antiCheat.calculateCheatScore(challenge, isCheating)\n    const hintsAvailable = await HintModel.count({ where: { ChallengeId: solvedChallenge.id } })\n    const hintsUnlocked = await HintModel.count({ where: { ChallengeId: solvedChallenge.id, unlocked: true } })\n    if (process.env.SOLUTIONS_WEBHOOK) {\n      webhook.notify(solvedChallenge, cheatScore, hintsAvailable, hintsUnlocked).catch((error: unknown) => {\n        logger.error('Webhook notification failed: ' + colors.red(utils.getErrorMessage(error)))\n      })\n    }\n  }\n}\n\nexport const sendNotification = function (challenge: ChallengeModel, isRestore: boolean) {\n  if (notSolved(challenge)) {\n    return\n  }\n\n  const flag = utils.ctfFlag(challenge.name)\n\n  const challengeKey = challenge.key as ChallengeKey\n  const fullChallenge = challenges[challengeKey]\n\n  let hasCodingChallenge = false\n  if (fullChallenge) {\n    hasCodingChallenge = Boolean(fullChallenge.hasCodingChallenge) ?? false\n  }\n\n  const notification = {\n    key: challenge.key,\n    name: challenge.name,\n    challenge: challenge.name + ' (' + entities.decode(sanitizeHtml(challenge.description, { allowedTags: [], allowedAttributes: {} })) + ')',\n    flag,\n    hidden: !config.get('challenges.showSolvedNotifications'),\n    isRestore,\n    codingChallenge: config.get('challenges.codingChallengesEnabled') !== 'never' && hasCodingChallenge\n  }\n  const wasPreviouslyShown = notifications.some(({ key }) => key === challenge.key)\n  notifications.push(notification)\n\n  if (globalWithSocketIO.io && (isRestore || !wasPreviouslyShown)) {\n    globalWithSocketIO.io.emit('challenge solved', notification)\n  }\n}\n\nexport const sendCodingChallengeNotification = function (challenge: { key: string, codingChallengeStatus: 0 | 1 | 2 }) {\n  if (challenge.codingChallengeStatus > 0) {\n    const notification = {\n      key: challenge.key,\n      codingChallengeStatus: challenge.codingChallengeStatus\n    }\n    if (globalWithSocketIO.io) {\n      globalWithSocketIO.io.emit('code challenge solved', notification)\n    }\n  }\n}\n\nexport const notSolved = (challenge: ChallengeModel) => challenge && !challenge.solved\n\nexport const findChallengeByName = (challengeName: string) => {\n  for (const challenge of Object.values(challenges)) {\n    if (challenge.name === challengeName) {\n      return challenge\n    }\n  }\n  logger.warn('Missing challenge with name: ' + challengeName.replace(/[\\r\\n]/g, ''))\n}\n\nexport const findChallengeById = (challengeId: number) => {\n  for (const challenge of Object.values(challenges)) {\n    if (challenge.id === challengeId) {\n      return challenge\n    }\n  }\n  logger.warn('Missing challenge with id: ' + challengeId)\n}\n\nexport const solveFindIt = async function (key: ChallengeKey, isRestore: boolean = false) {\n  const solvedChallenge = challenges[key]\n  await ChallengeModel.update({ codingChallengeStatus: 1 }, { where: { key, codingChallengeStatus: { [Op.lt]: 2 } } })\n  logger.info(`${isRestore ? colors.grey('Restored') : colors.green('Solved')} 'Find It' phase of coding challenge ${colors.cyan(solvedChallenge.key)} (${solvedChallenge.name})`)\n  if (!isRestore) {\n    accuracy.storeFindItVerdict(solvedChallenge.key, true)\n    accuracy.calculateFindItAccuracy(solvedChallenge.key)\n    await antiCheat.calculateFindItCheatScore(solvedChallenge)\n    sendCodingChallengeNotification({ key, codingChallengeStatus: 1 })\n  }\n}\n\nexport const solveFixIt = async function (key: ChallengeKey, isRestore: boolean = false) {\n  const solvedChallenge = challenges[key]\n  await ChallengeModel.update({ codingChallengeStatus: 2 }, { where: { key } })\n  logger.info(`${isRestore ? colors.grey('Restored') : colors.green('Solved')} 'Fix It' phase of coding challenge ${colors.cyan(solvedChallenge.key)} (${solvedChallenge.name})`)\n  if (!isRestore) {\n    accuracy.storeFixItVerdict(solvedChallenge.key, true)\n    accuracy.calculateFixItAccuracy(solvedChallenge.key)\n    await antiCheat.calculateFixItCheatScore(solvedChallenge)\n    sendCodingChallengeNotification({ key, codingChallengeStatus: 2 })\n  }\n}\n"}, {"id": "file-4", "path": "test/server/challengeUtils.unit.test.ts", "absolute_path": "/Users/jessica/Library/CloudStorage/OneDrive-IBM/GitHub/demo/juice-shop/test/server/challengeUtils.unit.test.ts", "language": "typescript", "content": "/*\n * Copyright (c) 2014-2026 Bjoern Kimminich & the OWASP Juice Shop contributors.\n * SPDX-License-Identifier: MIT\n */\n\nimport { describe, it, beforeEach, mock } from 'node:test'\nimport assert from 'node:assert/strict'\n\nconst antiCheat = require('../../lib/antiCheat')\nconst accuracy = require('../../lib/accuracy')\nconst { ChallengeModel } = require('../../models/challenge')\nconst { HintModel } = require('../../models/hint')\nconst datacache = require('../../data/datacache')\nconst config = require('config')\nconst logger = require('../../lib/logger').default\n\nconst challengeUtils = require('../../lib/challengeUtils')\n\nvoid describe('challengeUtils', () => {\n  beforeEach(() => {\n    datacache.challenges.scoreBoardChallenge = { id: 42, name: 'scoreBoardChallenge', key: 'scoreBoardChallenge', difficulty: 1 } as any\n    datacache.notifications.length = 0\n    ;(global as any).io = { emit: mock.fn() }\n    antiCheat.reset()\n    accuracy.reset()\n    HintModel.count = mock.fn(async () => 0)\n    ChallengeModel.update = mock.fn(async () => [1])\n  })\n\n  void describe('findChallengeByName', () => {\n    void it('returns undefined for non-existing challenge', () => {\n      const originalLoggerWarn = logger.warn\n      logger.warn = mock.fn()\n\n      try {\n        assert.equal(challengeUtils.findChallengeByName('blubbChallenge'), undefined)\n        assert.equal(logger.warn.mock.calls[0].arguments[0], 'Missing challenge with name: blubbChallenge')\n      } finally {\n        logger.warn = originalLoggerWarn\n      }\n    })\n\n    void it('does not allow line breaks in logged missing challenge names', () => {\n      const originalLoggerWarn = logger.warn\n      logger.warn = mock.fn()\n\n      try {\n        for (const challengeName of ['missing\\nforged', 'missing\\rforged', 'missing\\r\\nforged', 'missing\\n\\nforged']) {\n          assert.equal(challengeUtils.findChallengeByName(challengeName), undefined)\n        }\n        for (const call of logger.warn.mock.calls) {\n          assert.doesNotMatch(call.arguments[0], /[\\r\\n]/)\n        }\n      } finally {\n        logger.warn = originalLoggerWarn\n      }\n    })\n\n    void it('returns existing challenge', () => {\n      assert.equal(challengeUtils.findChallengeByName('scoreBoardChallenge'), datacache.challenges.scoreBoardChallenge)\n    })\n  })\n\n  void describe('findChallengeById', () => {\n    void it('returns undefined for non-existing challenge', () => {\n      assert.equal(challengeUtils.findChallengeById(43), undefined)\n    })\n\n    void it('returns existing challenge', () => {\n      assert.equal(challengeUtils.findChallengeById(42), datacache.challenges.scoreBoardChallenge)\n    })\n  })\n\n  void describe('notSolved', () => {\n    void it('returns true for unsolved challenge', () => {\n      assert.equal(challengeUtils.notSolved({ solved: false } as any), true)\n    })\n\n    void it('returns false for solved challenge', () => {\n      assert.equal(challengeUtils.notSolved({ solved: true } as any), false)\n    })\n\n    void it('returns falsy for null challenge', () => {\n      assert.equal(challengeUtils.notSolved(null as any), null)\n    })\n  })\n\n  void describe('solve', () => {\n    void it('should mark challenge as solved and save it', async () => {\n      const challenge = {\n        solved: false,\n        key: 'scoreBoardChallenge',\n        name: 'Score Board',\n        difficulty: 1,\n        id: 1,\n        save: mock.fn(async function (this: any) { return this })\n      } as any\n\n      const originalHintCount = HintModel.count\n      HintModel.count = mock.fn(async () => 0)\n\n      try {\n        await challengeUtils.solve(challenge)\n\n        assert.equal(challenge.solved, true)\n        assert.equal(challenge.save.mock.calls.length, 1)\n        assert.equal(datacache.notifications.length, 1)\n        assert.equal(datacache.notifications[0].key, 'scoreBoardChallenge')\n      } finally {\n        HintModel.count = originalHintCount\n      }\n    })\n\n    void it('should not calculate cheat score if it is a restore', async () => {\n      const challenge = {\n        solved: false,\n        key: 'scoreBoardChallenge',\n        name: 'Score Board',\n        difficulty: 1,\n        save: mock.fn(async function (this: any) { return this })\n      } as any\n\n      await challengeUtils.solve(challenge, true)\n\n      assert.equal(antiCheat.totalCheatScore(), 0)\n    })\n\n    void it('should log error if webhook notification fails', async () => {\n      const challenge = {\n        solved: false,\n        key: 'scoreBoardChallenge',\n        name: 'Score Board',\n        difficulty: 1,\n        id: 1,\n        save: mock.fn(async function (this: any) { return this })\n      } as any\n\n      process.env.SOLUTIONS_WEBHOOK = 'http://webhook.test'\n      const originalFetch = global.fetch\n      ;(global as any).fetch = mock.fn(async () => { throw new Error('Fetch error') })\n      const originalLoggerError = logger.error\n      logger.error = mock.fn()\n\n      try {\n        await challengeUtils.solve(challenge)\n        // Wait for unhandled promise in solve (webhook notification is not awaited)\n        await new Promise(resolve => setTimeout(resolve, 10))\n        assert.equal(logger.error.mock.calls.length, 1)\n        assert.match(logger.error.mock.calls[0].arguments[0], /Webhook notification failed/)\n      } finally {\n        delete process.env.SOLUTIONS_WEBHOOK\n        ;(global as any).fetch = originalFetch\n        logger.error = originalLoggerError\n      }\n    })\n  })\n\n  void describe('solveIf', () => {\n    void it('should solve challenge if criteria is met and not yet solved', async () => {\n      const challenge = {\n        solved: false,\n        key: 'scoreBoardChallenge',\n        name: 'Score Board',\n        difficulty: 1,\n        save: mock.fn(async function (this: any) { return this })\n      } as any\n      const criteria = () => true\n\n      await challengeUtils.solveIf(challenge, criteria)\n\n      assert.equal(challenge.solved, true)\n    })\n  })\n\n  void describe('sendCodingChallengeNotification', () => {\n    void it('should emit \"code challenge solved\" event via socket.io', () => {\n      const challenge = { key: 'test', codingChallengeStatus: 1 as const }\n      challengeUtils.sendCodingChallengeNotification(challenge)\n\n      const io = (global as any).io\n      assert.equal(io.emit.mock.calls.length, 1)\n      assert.equal(io.emit.mock.calls[0].arguments[0], 'code challenge solved')\n    })\n  })\n\n  void describe('solveFindIt', () => {\n    void it('should update status and calculate accuracy/cheat score', async () => {\n      const challengeKey = 'scoreBoardChallenge'\n      const originalUpdate = ChallengeModel.update\n      ChallengeModel.update = mock.fn(async () => [1])\n\n      try {\n        await challengeUtils.solveFindIt(challengeKey)\n\n        assert.equal(ChallengeModel.update.mock.calls.length, 1)\n        assert.equal(accuracy.getFindItAttempts(challengeKey), 1)\n\n        const io = (global as any).io\n        assert.equal(io.emit.mock.calls.length, 1)\n      } finally {\n        ChallengeModel.update = originalUpdate\n      }\n    })\n\n    void it('should not calculate accuracy/cheat score if it is a restore', async () => {\n      const challengeKey = 'scoreBoardChallenge'\n      const originalUpdate = ChallengeModel.update\n      ChallengeModel.update = mock.fn(async () => [1])\n\n      await challengeUtils.solveFindIt(challengeKey, true)\n\n      assert.equal(accuracy.getFindItAttempts(challengeKey), 0)\n      ChallengeModel.update = originalUpdate\n    })\n  })\n\n  void describe('solveFixIt', () => {\n    void it('should update status and calculate accuracy/cheat score', async () => {\n      const challengeKey = 'scoreBoardChallenge'\n      const originalUpdate = ChallengeModel.update\n      ChallengeModel.update = mock.fn(async () => [1])\n\n      try {\n        await challengeUtils.solveFixIt(challengeKey)\n\n        assert.equal(ChallengeModel.update.mock.calls.length, 1)\n\n        const io = (global as any).io\n        assert.equal(io.emit.mock.calls.length, 1)\n      } finally {\n        ChallengeModel.update = originalUpdate\n      }\n    })\n\n    void it('should not calculate accuracy/cheat score if it is a restore', async () => {\n      const challengeKey = 'scoreBoardChallenge'\n      const originalUpdate = ChallengeModel.update\n      ChallengeModel.update = mock.fn(async () => [1])\n\n      await challengeUtils.solveFixIt(challengeKey, true)\n\n      assert.equal(ChallengeModel.update.mock.calls.length, 1)\n      ChallengeModel.update = originalUpdate\n    })\n  })\n\n  void describe('sendNotification', () => {\n    void it('should push notification to datacache and emit via socket.io', (t) => {\n      const challenge = {\n        key: 'scoreBoardChallenge',\n        name: 'Score Board',\n        description: 'Find the score board',\n        solved: true\n      } as any\n\n      t.mock.method(config, 'get', (key: string) => {\n        if (key === 'challenges.showSolvedNotifications') return true\n        if (key === 'challenges.codingChallengesEnabled') return 'always'\n        return false\n      })\n\n      challengeUtils.sendNotification(challenge, false)\n\n      assert.equal(datacache.notifications.length, 1)\n      assert.equal(datacache.notifications[0].key, 'scoreBoardChallenge')\n\n      const io = (global as any).io\n      assert.equal(io.emit.mock.calls.length, 1)\n      assert.equal(io.emit.mock.calls[0].arguments[0], 'challenge solved')\n    })\n\n    void it('should handle missing fullChallenge', (t) => {\n      const challenge = {\n        key: 'nonExisting',\n        name: 'Non Existing',\n        description: 'desc',\n        solved: true\n      } as any\n\n      challengeUtils.sendNotification(challenge, false)\n\n      assert.equal(datacache.notifications.length, 1)\n      assert.equal(datacache.notifications[0].key, 'nonExisting')\n    })\n\n    void it('should respect showSolvedNotifications config', (t) => {\n      const challenge = {\n        key: 'scoreBoardChallenge',\n        name: 'Score Board',\n        description: 'desc',\n        solved: true\n      } as any\n\n      t.mock.method(config, 'get', (key: string) => {\n        if (key === 'challenges.showSolvedNotifications') return false\n        return true\n      })\n\n      challengeUtils.sendNotification(challenge, false)\n      assert.equal(datacache.notifications[0].hidden, true)\n    })\n\n    void it('should handle codingChallengesEnabled set to \"never\"', (t) => {\n      const challenge = {\n        key: 'scoreBoardChallenge',\n        name: 'Score Board',\n        description: 'desc',\n        solved: true\n      } as any\n      datacache.challenges.scoreBoardChallenge.hasCodingChallenge = true\n\n      t.mock.method(config, 'get', (key: string) => {\n        if (key === 'challenges.codingChallengesEnabled') return 'never'\n        return true\n      })\n\n      challengeUtils.sendNotification(challenge, false)\n      assert.equal(datacache.notifications[0].codingChallenge, false)\n    })\n  })\n})\n"}, {"id": "file-5", "path": "test/api/repeat-notification.test.ts", "absolute_path": "/Users/jessica/Library/CloudStorage/OneDrive-IBM/GitHub/demo/juice-shop/test/api/repeat-notification.test.ts", "language": "typescript", "content": "/*\n * Copyright (c) 2014-2026 Bjoern Kimminich & the OWASP Juice Shop contributors.\n * SPDX-License-Identifier: MIT\n */\n\nimport { describe, it, before, mock } from 'node:test'\nimport assert from 'node:assert/strict'\nimport request from 'supertest'\nimport type { Express } from 'express'\nimport { createTestApp } from './helpers/setup'\nimport * as challengeUtils from '../../lib/challengeUtils'\nimport { challenges } from '../../data/datacache'\nimport logger from '../../lib/logger'\n\nlet app: Express\n\nbefore(async () => {\n  const result = await createTestApp()\n  app = result.app\n}, { timeout: 60000 })\n\nvoid describe('/rest/repeat-notification', () => {\n  void it('GET triggers repeating notification without passing a challenge', async () => {\n    const res = await request(app)\n      .get('/rest/repeat-notification')\n\n    assert.equal(res.status, 200)\n  })\n\n  void it('GET triggers repeating notification passing an unsolved challenge', async () => {\n    const res = await request(app)\n      .get('/rest/repeat-notification?challenge=Retrieve%20Blueprint')\n\n    assert.equal(res.status, 200)\n  })\n\n  void it('GET does not allow line breaks in logged missing challenge names', async () => {\n    const originalLoggerWarn = logger.warn\n    const loggerWarn = mock.fn()\n    logger.warn = loggerWarn as unknown as typeof logger.warn\n\n    try {\n      const res = await request(app)\n        .get('/rest/repeat-notification?challenge=missing%0D%0Aforged%20log%20entry')\n\n      assert.equal(res.status, 200)\n      assert.doesNotMatch(loggerWarn.mock.calls[0].arguments[0], /[\\r\\n]/)\n    } finally {\n      logger.warn = originalLoggerWarn\n    }\n  })\n\n  void it('GET triggers repeating notification passing   <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
  <script>
    const data = EXPLANATION_DATA;
    const sectionTabsEl = document.getElementById('section-tabs');
    const sectionContentEl = document.getElementById('section-content');
    const pageTitleEl = document.getElementById('page-title');
    const explanationScrollEl = document.querySelector('.explanation-scroll');
    const mermaidModalEl = document.getElementById('mermaid-modal');
    const mermaidModalContentEl = document.getElementById('mermaid-modal-content');
    const mermaidModalCloseEl = document.getElementById('mermaid-modal-close');
    const codeFilePathEl = document.getElementById('code-file-path');
    const codeLineRangeEl = document.getElementById('code-line-range');
    const codeMetaEl = document.getElementById('code-meta');
    const codeFooterEl = document.getElementById('code-footer');

    const referencePattern = /\[\[((?:[A-Za-z0-9._-]+\/)*[A-Za-z0-9._-]+(?:\.[A-Za-z0-9._-]+)?:(?:\d+)(?:-\d+)?)\]\]/g;
    const referencesById = new Map(data.references.map(ref => [ref.id, ref]));
    const referencesByLiteral = new Map(data.references.map(ref => [ref.literal, ref]));
    const filesById = new Map(data.files.map(file => [file.id, file]));

    let headings = [];
    let activeHeadingId = null;
    let activeReferenceId = null;
    let editor = null;
    let currentModel = null;
    let currentDecorations = [];
    const modelsByFileId = new Map();

    pageTitleEl.textContent = data.title || 'Code Explanation';
    document.title = data.title || 'Code Explanation Viewer';

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function slugify(value) {
      return value
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '') || 'section';
    }

    function createReferenceButton(ref) {
      const button = document.createElement('button');
      button.className = `ref-chip${activeReferenceId === ref.id ? ' active' : ''}`;
      button.type = 'button';
      button.dataset.refId = ref.id;
      button.textContent = ref.literal;
      return button;
    }

    function replaceReferencesInTextNode(textNode) {
      const text = textNode.nodeValue;
      if (!text || !referencesByLiteral.size) {
        return;
      }

      referencePattern.lastIndex = 0;
      let match = null;
      let lastIndex = 0;
      let changed = false;
      const fragment = document.createDocumentFragment();

      while ((match = referencePattern.exec(text)) !== null) {
        const literal = match[0];
        const ref = referencesByLiteral.get(literal);
        if (!ref) {
          continue;
        }

        const fullStart = match.index;
        const literalEnd = fullStart + literal.length;

        if (fullStart > lastIndex) {
          fragment.appendChild(document.createTextNode(text.slice(lastIndex, fullStart)));
        }
        fragment.appendChild(createReferenceButton(ref));
        lastIndex = literalEnd;
        changed = true;
      }

      if (!changed) {
        return;
      }

      if (lastIndex < text.length) {
        fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
      }

      textNode.parentNode.replaceChild(fragment, textNode);
    }

    function enhanceInlineReferences() {
      const textNodes = [];
      const walker = document.createTreeWalker(sectionContentEl, NodeFilter.SHOW_TEXT, {
        acceptNode(node) {
          if (!node.nodeValue || !node.nodeValue.trim()) {
            return NodeFilter.FILTER_REJECT;
          }

          const parent = node.parentElement;
          if (!parent) {
            return NodeFilter.FILTER_REJECT;
          }

          if (parent.closest('pre, code, button, a, script, style')) {
            return NodeFilter.FILTER_REJECT;
          }

          return NodeFilter.FILTER_ACCEPT;
        }
      });

      while (walker.nextNode()) {
        textNodes.push(walker.currentNode);
      }

      textNodes.forEach(replaceReferencesInTextNode);

      sectionContentEl.querySelectorAll('code').forEach(codeEl => {
        if (codeEl.closest('pre')) {
          return;
        }
        const literal = codeEl.textContent.trim();
        const ref = referencesByLiteral.get(literal);
        if (!ref) {
          return;
        }
        codeEl.replaceWith(createReferenceButton(ref));
      });
    }

    function captureHeadings() {
      const usedIds = new Set();
      const headingNodes = Array.from(sectionContentEl.querySelectorAll('h2, h3'));
      headings = headingNodes.map(heading => {
        const baseId = slugify(heading.textContent || 'section');
        let id = baseId;
        let counter = 2;
        while (usedIds.has(id)) {
          id = `${baseId}-${counter}`;
          counter += 1;
        }
        usedIds.add(id);
        heading.id = id;
        return {
          id,
          title: heading.textContent || 'Untitled section',
          level: heading.tagName === 'H3' ? 3 : 2,
          element: heading,
        };
      });

      activeHeadingId = headings[0]?.id || null;
    }

    function closeMermaidModal() {
      mermaidModalEl.classList.remove('open');
      mermaidModalEl.setAttribute('aria-hidden', 'true');
      mermaidModalContentEl.innerHTML = '';
    }

    function openMermaidModal(sourceNode) {
      mermaidModalContentEl.innerHTML = '';
      const clone = sourceNode.cloneNode(true);
      const expandButton = clone.querySelector('.mermaid-expand');
      if (expandButton) {
        expandButton.remove();
      }
      mermaidModalContentEl.appendChild(clone);
      mermaidModalEl.classList.add('open');
      mermaidModalEl.setAttribute('aria-hidden', 'false');
    }

    function renderSectionTabs() {
      if (!headings.length) {
        sectionTabsEl.innerHTML = '<div class="section-empty">Add `##` headings to create section navigation.</div>';
        return;
      }

      sectionTabsEl.innerHTML = headings.map(heading => `
        <button
          class="section-tab${heading.id === activeHeadingId ? ' active' : ''}"
          data-heading-id="${escapeHtml(heading.id)}"
          style="margin-left:${heading.level === 3 ? '12px' : '0'}"
        >
          ${escapeHtml(heading.title)}
        </button>
      `).join('');
    }

    function updateActiveHeadingFromScroll() {
      if (!headings.length) {
        return;
      }

      const scrollTop = explanationScrollEl.scrollTop;
      let currentHeading = headings[0];
      for (const heading of headings) {
        if (heading.element.offsetTop - scrollTop <= 80) {
          currentHeading = heading;
        } else {
          break;
        }
      }

      if (currentHeading && currentHeading.id !== activeHeadingId) {
        activeHeadingId = currentHeading.id;
        renderSectionTabs();
      }
    }

    function ensureEditor() {
      return new Promise((resolve, reject) => {
        if (window.monaco && window.monaco.editor && editor) {
          resolve();
          return;
        }

        if (!(window.require && window.require.config)) {
          reject(new Error('Monaco loader did not initialize.'));
          return;
        }

        window.require.config({
          paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs' }
        });

        window.require(['vs/editor/editor.main'], () => {
          if (!editor) {
            editor = monaco.editor.create(document.getElementById('editor'), {
              value: '',
              language: 'plaintext',
              theme: 'vs-dark',
              readOnly: true,
              minimap: { enabled: false },
              scrollBeyondLastLine: false,
              wordWrap: 'off',
              renderLineHighlight: 'all',
              fontSize: 13,
              fontFamily: 'IBM Plex Mono, Menlo, monospace'
            });

            const style = document.createElement('style');
            style.textContent = `
              .highlighted-reference-line {
                background: rgba(124, 199, 255, 0.16);
              }
              .highlighted-reference-gutter {
                border-left: 3px solid rgba(124, 199, 255, 0.92);
                margin-left: 4px;
              }
            `;
            document.head.appendChild(style);
          }
          resolve();
        }, error => reject(error));
      });
    }

    function modelForFile(file) {
      if (modelsByFileId.has(file.id)) {
        return modelsByFileId.get(file.id);
      }

      const uri = monaco.Uri.parse(`inmemory://model/${file.path}`);
      const model = monaco.editor.createModel(file.content, file.language || 'plaintext', uri);
      modelsByFileId.set(file.id, model);
      return model;
    }

    async function openReference(refId) {
      const ref = referencesById.get(refId);
      if (!ref) {
        return;
      }

      activeReferenceId = refId;
      sectionContentEl.querySelectorAll('[data-ref-id]').forEach(button => {
        button.classList.toggle('active', button.getAttribute('data-ref-id') === refId);
      });

      try {
        await ensureEditor();
      } catch (error) {
        document.getElementById('editor-wrap').innerHTML = `<div class="monaco-error">Unable to load Monaco from CDN.<br>${escapeHtml(String(error))}</div>`;
        return;
      }

      const file = filesById.get(ref.file_id);
      if (!file) {
        return;
      }

      const model = modelForFile(file);
      if (currentModel !== model) {
        editor.setModel(model);
        currentModel = model;
      }

      currentDecorations = editor.deltaDecorations(currentDecorations, [
        {
          range: new monaco.Range(ref.start_line, 1, ref.end_line, 1),
          options: {
            isWholeLine: true,
            className: 'highlighted-reference-line',
            linesDecorationsClassName: 'highlighted-reference-gutter'
          }
        }
      ]);

      editor.revealLineInCenter(ref.start_line);
      editor.setPosition({ lineNumber: ref.start_line, column: 1 });

      codeFilePathEl.textContent = ref.file_path;
      codeLineRangeEl.textContent = ref.start_line === ref.end_line
        ? `line ${ref.start_line}`
        : `lines ${ref.start_line}-${ref.end_line}`;
      codeMetaEl.textContent = ref.literal;
      codeFooterEl.textContent = `${ref.file_path}:${ref.start_line}${ref.end_line !== ref.start_line ? '-' + ref.end_line : ''} | repo root ${data.repoRoot}`;
    }

    async function renderMarkdown() {
      if (!(window.markdownit && window.markdownit)) {
        sectionContentEl.innerHTML = '<div class="empty-state">Unable to load markdown renderer.</div>';
        return;
      }

      const md = window.markdownit({
        html: false,
        linkify: true,
        typographer: true,
      });

      sectionContentEl.innerHTML = md.render(data.markdown || '');

      const firstHeading = sectionContentEl.querySelector('h1');
      if (firstHeading) {
        pageTitleEl.textContent = firstHeading.textContent || data.title || 'Code Explanation';
        firstHeading.remove();
      }

      enhanceInlineReferences();
      await renderMermaid();
      captureHeadings();
      renderSectionTabs();
      updateActiveHeadingFromScroll();
    }

    async function renderMermaid() {
      const mermaidBlocks = Array.from(sectionContentEl.querySelectorAll('pre > code.language-mermaid'));
      if (!mermaidBlocks.length || !window.mermaid) {
        return;
      }

      window.mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        securityLevel: 'loose',
      });

      const containers = [];
      mermaidBlocks.forEach((codeBlock, index) => {
        const pre = codeBlock.parentElement;
        if (!pre) {
          return;
        }
        const container = document.createElement('div');
        container.className = 'mermaid-wrap';
        const expandButton = document.createElement('button');
        expandButton.className = 'mermaid-expand';
        expandButton.type = 'button';
        expandButton.textContent = 'Expand';
        expandButton.addEventListener('click', () => openMermaidModal(container));
        container.appendChild(expandButton);
        const diagram = document.createElement('div');
        diagram.className = 'mermaid mermaid-diagram';
        diagram.id = `mermaid-${index + 1}`;
        diagram.textContent = codeBlock.textContent;
        container.appendChild(diagram);
        pre.replaceWith(container);
        containers.push(diagram);
      });

      try {
        await window.mermaid.run({ nodes: containers });
      } catch (error) {
        containers.forEach(container => {
          container.classList.add('mermaid-error');
          container.textContent = `Unable to render mermaid diagram.\n${String(error)}`;
        });
      }
    }

    async function initialize() {
      await renderMarkdown();

      if (data.references.length > 0) {
        openReference(data.references[0].id);
      }
    }

    sectionTabsEl.addEventListener('click', event => {
      const button = event.target.closest('[data-heading-id]');
      if (!button) {
        return;
      }

      const headingId = button.getAttribute('data-heading-id');
      const heading = headings.find(item => item.id === headingId);
      if (!heading) {
        return;
      }

      activeHeadingId = headingId;
      renderSectionTabs();
      explanationScrollEl.scrollTo({ top: Math.max(heading.element.offsetTop - 18, 0), behavior: 'smooth' });
    });

    sectionContentEl.addEventListener('click', event => {
      const button = event.target.closest('[data-ref-id]');
      if (!button) {
        return;
      }

      openReference(button.getAttribute('data-ref-id'));
    });

    explanationScrollEl.addEventListener('scroll', updateActiveHeadingFromScroll);
    mermaidModalCloseEl.addEventListener('click', closeMermaidModal);
    mermaidModalEl.addEventListener('click', event => {
      if (event.target === mermaidModalEl) {
        closeMermaidModal();
      }
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && mermaidModalEl.classList.contains('open')) {
        closeMermaidModal();
      }
    });

    initialize();
  </script>
</body>
</html>
